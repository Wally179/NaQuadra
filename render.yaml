services:
  - type: web
    name: naquadra-api
    env: node
    buildCommand: pnpm install && pnpm build --filter=@naquadra/api...
    startCommand: cd apps/api && pnpm start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_DB
        value: false
      - key: CORS_ORIGIN
        value: https://naquadra.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: THROTTLE_TTL
        value: "60000"
      - key: THROTTLE_LIMIT
        value: "100"
      # As senhas/URLs de banco reais devem ser configuradas via dashboard do Render
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
